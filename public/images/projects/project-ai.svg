<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ai-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0c19" />
      <stop offset="100%" stop-color="#080710" />
    </linearGradient>
    <linearGradient id="ai-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="ai-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>
    <pattern id="ai-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#818cf8" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#ai-bg)" />
  <rect width="100%" height="100%" fill="url(#ai-grid)" />
  <circle cx="400" cy="225" r="230" fill="url(#ai-glow)" filter="blur(50px)" />

  <g transform="translate(65, 45)">
    <rect width="670" height="360" rx="14" fill="#141122" stroke="#2a2444" stroke-width="1.5" />

    <!-- Titlebar -->
    <path d="M 0 14 Q 0 0 14 0 L 656 0 Q 670 0 670 14 L 670 40 L 0 40 Z" fill="#1b172e" />
    <circle cx="22" cy="20" r="4.5" fill="#ef4444" opacity="0.8" />
    <circle cx="38" cy="20" r="4.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="54" cy="20" r="4.5" fill="#10b981" opacity="0.8" />
    <text x="75" y="24" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="11">ai-model // tensor-inference-graph</text>
    <text x="535" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">Loss: 0.0142</text>

    <!-- Synaptic Connection Lines -->
    <!-- Input Layer (x=100) -> Hidden 1 (x=240) -->
    <!-- Input nodes: y=[100, 160, 220, 280] -->
    <!-- Hidden 1: y=[80, 130, 180, 230, 280, 310] -->
    <g stroke="url(#ai-line)" stroke-width="0.8" stroke-opacity="0.35">
      <line x1="100" y1="110" x2="240" y2="80" /><line x1="100" y1="110" x2="240" y2="135" /><line x1="100" y1="110" x2="240" y2="190" /><line x1="100" y1="110" x2="240" y2="245" /><line x1="100" y1="110" x2="240" y2="300" />
      <line x1="100" y1="170" x2="240" y2="80" /><line x1="100" y1="170" x2="240" y2="135" /><line x1="100" y1="170" x2="240" y2="190" /><line x1="100" y1="170" x2="240" y2="245" /><line x1="100" y1="170" x2="240" y2="300" />
      <line x1="100" y1="230" x2="240" y2="80" /><line x1="100" y1="230" x2="240" y2="135" /><line x1="100" y1="230" x2="240" y2="190" /><line x1="100" y1="230" x2="240" y2="245" /><line x1="100" y1="230" x2="240" y2="300" />
      <line x1="100" y1="290" x2="240" y2="80" /><line x1="100" y1="290" x2="240" y2="135" /><line x1="100" y1="290" x2="240" y2="190" /><line x1="100" y1="290" x2="240" y2="245" /><line x1="100" y1="290" x2="240" y2="300" />

      <!-- Hidden 1 (x=240) -> Hidden 2 (x=380) -->
      <line x1="240" y1="80" x2="380" y2="110" /><line x1="240" y1="80" x2="380" y2="170" /><line x1="240" y1="80" x2="380" y2="230" /><line x1="240" y1="80" x2="380" y2="290" />
      <line x1="240" y1="135" x2="380" y2="110" /><line x1="240" y1="135" x2="380" y2="170" /><line x1="240" y1="135" x2="380" y2="230" /><line x1="240" y1="135" x2="380" y2="290" />
      <line x1="240" y1="190" x2="380" y2="110" /><line x1="240" y1="190" x2="380" y2="170" /><line x1="240" y1="190" x2="380" y2="230" /><line x1="240" y1="190" x2="380" y2="290" />
      <line x1="240" y1="245" x2="380" y2="110" /><line x1="240" y1="245" x2="380" y2="170" /><line x1="240" y1="245" x2="380" y2="230" /><line x1="240" y1="245" x2="380" y2="290" />
      <line x1="240" y1="300" x2="380" y2="110" /><line x1="240" y1="300" x2="380" y2="170" /><line x1="240" y1="300" x2="380" y2="230" /><line x1="240" y1="300" x2="380" y2="290" />

      <!-- Hidden 2 (x=380) -> Output (x=520) -->
      <line x1="380" y1="110" x2="520" y2="150" /><line x1="380" y1="110" x2="520" y2="240" />
      <line x1="380" y1="170" x2="520" y2="150" /><line x1="380" y1="170" x2="520" y2="240" />
      <line x1="380" y1="230" x2="520" y2="150" /><line x1="380" y1="230" x2="520" y2="240" />
      <line x1="380" y1="290" x2="520" y2="150" /><line x1="380" y1="290" x2="520" y2="240" />
    </g>

    <!-- Strong Active Paths -->
    <line x1="100" y1="170" x2="240" y2="135" stroke="#38bdf8" stroke-width="2" />
    <line x1="240" y1="135" x2="380" y2="170" stroke="#c084fc" stroke-width="2" />
    <line x1="380" y1="170" x2="520" y2="150" stroke="#818cf8" stroke-width="2.5" />

    <!-- Nodes: Input -->
    <g>
      <circle cx="100" cy="110" r="10" fill="#1b172e" stroke="#818cf8" stroke-width="1.8" />
      <circle cx="100" cy="170" r="12" fill="#38bdf8" />
      <circle cx="100" cy="230" r="10" fill="#1b172e" stroke="#818cf8" stroke-width="1.8" />
      <circle cx="100" cy="290" r="10" fill="#1b172e" stroke="#818cf8" stroke-width="1.8" />
      <text x="80" y="325" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">INPUT [X]</text>
    </g>

    <!-- Nodes: Hidden 1 -->
    <g>
      <circle cx="240" cy="80" r="9" fill="#1b172e" stroke="#c084fc" stroke-width="1.5" />
      <circle cx="240" cy="135" r="13" fill="#c084fc" />
      <circle cx="240" cy="190" r="9" fill="#1b172e" stroke="#c084fc" stroke-width="1.5" />
      <circle cx="240" cy="245" r="9" fill="#1b172e" stroke="#c084fc" stroke-width="1.5" />
      <circle cx="240" cy="300" r="9" fill="#1b172e" stroke="#c084fc" stroke-width="1.5" />
      <text x="215" y="325" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">HIDDEN #1</text>
    </g>

    <!-- Nodes: Hidden 2 -->
    <g>
      <circle cx="380" cy="110" r="9" fill="#1b172e" stroke="#818cf8" stroke-width="1.5" />
      <circle cx="380" cy="170" r="13" fill="#818cf8" />
      <circle cx="380" cy="230" r="9" fill="#1b172e" stroke="#818cf8" stroke-width="1.5" />
      <circle cx="380" cy="290" r="9" fill="#1b172e" stroke="#818cf8" stroke-width="1.5" />
      <text x="355" y="325" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">HIDDEN #2</text>
    </g>

    <!-- Nodes: Output -->
    <g>
      <circle cx="520" cy="150" r="15" fill="#38bdf8" />
      <circle cx="520" cy="240" r="11" fill="#1b172e" stroke="#38bdf8" stroke-width="2" />
      <text x="500" y="325" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">PREDICTION</text>
    </g>

    <!-- Right-Hand Diagnostic Metric Box -->
    <g transform="translate(560, 60)">
      <rect width="95" height="110" rx="8" fill="#1a162b" stroke="#342c54" stroke-width="1" />
      <text x="12" y="24" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="9">EPOCH</text>
      <text x="12" y="48" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">120/120</text>
      <text x="12" y="70" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="9">ACCURACY</text>
      <text x="12" y="94" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">98.4%</text>
    </g>
  </g>
</svg>

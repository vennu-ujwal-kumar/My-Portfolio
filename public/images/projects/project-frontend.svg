<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="fe-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101b" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="fe-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="fe-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <pattern id="fe-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#06b6d4" stroke-width="0.5" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#fe-bg)" />
  <rect width="100%" height="100%" fill="url(#fe-grid)" />
  <circle cx="450" cy="200" r="230" fill="url(#fe-glow)" filter="blur(50px)" />


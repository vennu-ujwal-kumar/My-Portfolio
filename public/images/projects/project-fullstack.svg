<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="fs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1117" />
      <stop offset="100%" stop-color="#08090c" />
    </linearGradient>
    <linearGradient id="fs-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="fs-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>
    <pattern id="fs-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#fs-bg)" />
  <rect width="100%" height="100%" fill="url(#fs-grid)" />
  <circle cx="400" cy="180" r="220" fill="url(#fs-glow)" filter="blur(40px)" />

  <!-- Window Container -->
  <g transform="translate(60, 40)">
    <rect width="680" height="370" rx="14" fill="#13161f" stroke="#252936" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <path d="M 0 14 Q 0 0 14 0 L 666 0 Q 680 0 680 14 L 680 38 L 0 38 Z" fill="#181c27" />
    <circle cx="20" cy="19" r="4.5" fill="#ef4444" opacity="0.8" />
    <circle cx="36" cy="19" r="4.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="52" cy="19" r="4.5" fill="#10b981" opacity="0.8" />
    <text x="74" y="23" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">fullstack-arch // cluster-v1</text>
    <rect x="580" y="10" width="80" height="18" rx="9" fill="#202637" />
    <circle cx="592" cy="19" r="3" fill="#10b981" />
    <text x="602" y="22" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">ONLINE</text>

    <!-- Sidebar -->
    <rect x="16" y="52" width="130" height="300" rx="8" fill="#161a24" stroke="#222838" stroke-width="1" />
    <rect x="28" y="70" width="70" height="8" rx="4" fill="#38bdf8" fill-opacity="0.7" />
    <rect x="28" y="92" width="100" height="6" rx="3" fill="#334155" />
    <rect x="28" y="110" width="85" height="6" rx="3" fill="#334155" />
    <rect x="28" y="128" width="92" height="6" rx="3" fill="#334155" />
    <rect x="28" y="160" width="60" height="8" rx="4" fill="#818cf8" fill-opacity="0.6" />
    <rect x="28" y="180" width="95" height="6" rx="3" fill="#334155" />
    <rect x="28" y="198" width="78" height="6" rx="3" fill="#334155" />

    <!-- Main Chart / Architecture Area -->
    <rect x="160" y="52" width="340" height="175" rx="8" fill="#161a24" stroke="#222838" stroke-width="1" />
    <text x="178" y="76" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Data Flow &amp; API Gateway Throughput</text>
    
    <!-- Flow Graph Paths -->
    <path d="M 180 170 Q 240 100 300 130 T 400 110 T 480 80" fill="none" stroke="url(#fs-accent)" stroke-width="2.5" />
    <path d="M 180 170 Q 240 100 300 130 T 400 110 T 480 80 L 480 190 L 180 190 Z" fill="url(#fs-glow)" opacity="0.4" />
    <circle cx="300" cy="130" r="4" fill="#38bdf8" />
    <circle cx="400" cy="110" r="4" fill="#818cf8" />
    <circle cx="480" cy="80" r="4" fill="#38bdf8" />

    <!-- Terminal Widget Area -->
    <rect x="160" y="240" width="340" height="112" rx="8" fill="#0d1117" stroke="#222838" stroke-width="1" />
    <text x="176" y="262" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">$ node server.js --cluster</text>
    <text x="176" y="280" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">[gateway] listening on :8080</text>
    <text x="176" y="298" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">[database] postgres pool initialized</text>
    <text x="176" y="316" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">[auth] JWT handshake verified: 200 OK</text>
    <rect x="365" y="322" width="6" height="10" fill="#38bdf8" opacity="0.8" />

    <!-- Right Side Stats Cards -->
    <rect x="514" y="52" width="150" height="82" rx="8" fill="#161a24" stroke="#222838" stroke-width="1" />
    <text x="528" y="74" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">LATENCY</text>
    <text x="528" y="104" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700">14.2 ms</text>
    <text x="528" y="122" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">▼ 4.1% p99</text>

    <rect x="514" y="145" width="150" height="82" rx="8" fill="#161a24" stroke="#222838" stroke-width="1" />
    <text x="528" y="167" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">REQUESTS</text>
    <text x="528" y="197" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700">2.4k/s</text>
    <text x="528" y="215" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">99.98% ok</text>

    <rect x="514" y="240" width="150" height="112" rx="8" fill="#161a24" stroke="#222838" stroke-width="1" />
    <text x="528" y="262" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">ACTIVE STACK</text>
    <rect x="528" y="274" width="55" height="18" rx="9" fill="#38bdf8" fill-opacity="0.15" />
    <text x="538" y="287" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">React</text>
    <rect x="590" y="274" width="58" height="18" rx="9" fill="#10b981" fill-opacity="0.15" />
    <text x="600" y="287" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">Node</text>
    <rect x="528" y="300" width="62" height="18" rx="9" fill="#818cf8" fill-opacity="0.15" />
    <text x="538" y="313" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="9">REST</text>
    <rect x="598" y="300" width="54" height="18" rx="9" fill="#f59e0b" fill-opacity="0.15" />
    <text x="608" y="313" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="9">SQL</text>
  </g>
</svg>
